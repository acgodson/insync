plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.insync.app"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.insync.app"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0"
        // Meta Wearables credentials (0/0 = Developer Mode)
        manifestPlaceholders["mwdat_application_id"] = "0"
        manifestPlaceholders["mwdat_client_token"] = "0"
    }

    androidResources { noCompress "task" }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// Web UI: bundle the teammate's build (web/dist/index.html) as a Flutter asset
tasks.register("copyWebUi", Copy) {
    from "../../../web/dist"
    into "../../assets/web"
    include "index.html"
}
tasks.matching { it.name.startsWith("compileFlutterBuild") }.configureEach { dependsOn("copyWebUi") }

dependencies {
    implementation "com.meta.wearable:mwdat-core:1.0.1"
    implementation "com.meta.wearable:mwdat-camera:1.0.1"
    implementation "com.meta.wearable:mwdat-mockdevice:1.0.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    // Calibration: phone front camera + MediaPipe Face Landmarker
    implementation "com.google.mediapipe:tasks-vision:0.10.35"
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
}
