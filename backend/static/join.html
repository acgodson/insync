<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>InSync room</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' role='img' aria-label='InSync'%3E%3Crect width='100' height='100' rx='22' fill='%23111111'/%3E%3Cg transform='translate(11 20.5122) scale(0.47561)'%3E%3Cg fill='%238EC5E8'%3E%3Crect x='0' y='50' width='17' height='27' rx='8.5'/%3E%3Crect x='22' y='37' width='17' height='52' rx='8.5'/%3E%3C/g%3E%3Cg fill='%23F3F3EE'%3E%3Cpath d='M44 104 L44 33.5 A8.5 8.5 0 0 1 61 33.5 L61 66 L66 66 L66 17.5 A8.5 8.5 0 0 1 83 17.5 L83 66 L88 66 L88 8.5 A8.5 8.5 0 0 1 105 8.5 L105 66 L110 66 L110 17.5 A8.5 8.5 0 0 1 127 17.5 L127 104 A20 20 0 0 1 107 124 L64 124 A20 20 0 0 1 44 104Z'/%3E%3C/g%3E%3Cg fill='%23E9B84E'%3E%3Crect x='122.19' y='82' width='48.62' height='17' rx='8.5' transform='rotate(-55.30 146.5 90.5)'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { --bg:#0e1116; --panel:#161a21; --line:#262c36; --text:#eef1f6; --muted:#8b93a1; --accent:#4f8cff; --signer:#f5b84b; --bad:#e5534b; --ok:#3fb950; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; max-width:820px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 16px 0; }

  /* Header: wordmark, room code, connection */
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:baseline; gap:12px; min-width:0; }
  .mark { font-weight:800; font-size:20px; letter-spacing:-.02em; }
  .mark span { color:var(--accent); }
  .code { font:600 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.18em; color:var(--muted); }
  .conn { font-size:13px; color:var(--muted); white-space:nowrap; }
  .conn::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:currentColor; margin-right:6px; vertical-align:1px; }
  .conn.ok { color:var(--ok); } .conn.bad { color:var(--bad); }

  /* Room bar: signer state, people, speak toggle */
  #roombar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 0; }
  #signer { font-size:14px; font-weight:600; color:var(--muted); }
  #signer.live { color:var(--signer); }
  #people { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:13px; }
  .chip.signer { border-color:var(--signer); color:var(--signer); }
  .chip.me { border-color:var(--accent); }
  .toggle { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); cursor:pointer; user-select:none; }
  .toggle input { width:18px; height:18px; accent-color:var(--accent); margin:0; }

  /* Captions: newest at the bottom */
  #captions { flex:1; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:180px; display:flex; flex-direction:column; }
  #captions::before { content:""; flex:1; }
  .cap { padding:8px 12px; border-radius:10px; margin-top:8px; border-left:3px solid var(--line); }
  .cap .who { font-size:13px; color:var(--muted); font-weight:600; }
  .cap .txt { font-size:22px; line-height:1.35; overflow-wrap:anywhere; }
  .cap.signer { background:rgba(245,184,75,.10); border-left-color:var(--signer); }
  .cap.signer .who { color:var(--signer); }
  .cap.me { border-left-color:var(--accent); }
  .empty { color:var(--muted); text-align:center; margin:auto; padding:24px 0; }

  /* Controls */
  #controls { padding:12px 0 calc(14px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:12px; }
  #mic { flex:none; width:64px; height:64px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  #mic.on { background:var(--bad); animation:pulse 1.2s infinite; }
  #mic:disabled { background:var(--line); color:var(--muted); cursor:default; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(229,83,75,.2); } }
  .right { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  #micnote { font-size:13px; color:var(--muted); min-height:1.2em; }
  form { display:flex; gap:8px; width:100%; }
  input[type=text], input:not([type]) { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px; }
  button.send { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:12px 18px; font-size:16px; font-weight:600; cursor:pointer; }

  /* Name prompt */
  #namebox { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:16px; }
  #namebox .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; }
  #namebox p { margin:0; color:var(--muted); font-size:14px; }
  [hidden] { display:none !important; }

  @media (min-width:700px) { .cap .txt { font-size:26px; } body { padding-top:18px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark"><svg style="height:22px;width:auto;display:block" xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 540 132" role="img" aria-label="InSync"><g><g fill="#8EC5E8"><rect x="0" y="50" width="17" height="27" rx="8.5"/><rect x="22" y="37" width="17" height="52" rx="8.5"/></g><g fill="#F3F3EE"><path d="M44 104 L44 33.5 A8.5 8.5 0 0 1 61 33.5 L61 66 L66 66 L66 17.5 A8.5 8.5 0 0 1 83 17.5 L83 66 L88 66 L88 8.5 A8.5 8.5 0 0 1 105 8.5 L105 66 L110 66 L110 17.5 A8.5 8.5 0 0 1 127 17.5 L127 104 A20 20 0 0 1 107 124 L64 124 A20 20 0 0 1 44 104Z"/></g><g fill="#E9B84E"><rect x="122.19" y="82" width="48.62" height="17" rx="8.5" transform="rotate(-55.30 146.5 90.5)"/></g></g><g fill="#F3F3EE" transform="translate(206 99.2) scale(0.05542 -0.05542)"><path transform="translate(-117.0 0)" d="M138 0V1118H398V0ZM268 1276Q206 1276 161.5 1317.5Q117 1359 117 1419Q117 1478 161.5 1519.5Q206 1561 268 1561Q331 1561 375.5 1519.5Q420 1478 420 1419Q420 1359 375.5 1317.5Q331 1276 268 1276Z"/><path transform="translate(321.1 0)" d="M398 655V0H138V1118H384L387 895Q487 1132 733 1132Q906 1132 1010.5 1022Q1115 912 1115 711V0H855V671Q855 783 797 847Q739 911 637 911Q533 911 465.5 844Q398 777 398 655Z"/><path transform="translate(1476.1 0)" d="M561 -23Q368 -23 242.5 59.5Q117 142 88 294L331 340Q375 176 566 176Q662 176 718.5 214.5Q775 253 775 310Q775 405 624 438L433 479Q119 547 119 792Q119 896 176 972Q233 1048 334.5 1090Q436 1132 570 1132Q760 1132 870.5 1053Q981 974 1015 844L783 798Q763 856 713 897Q663 938 573 938Q491 938 435 901.5Q379 865 379 808Q379 759 415.5 727.5Q452 696 538 677L728 637Q1041 570 1041 335Q1041 229 980 148.5Q919 68 810.5 22.5Q702 -23 561 -23Z"/><path transform="translate(2503.2 0)" d="M127 -399 188 -196 219 -204Q307 -228 366 -199.5Q425 -171 445 -75L461 -4L39 1118H317L521 510Q545 437 563 364.5Q581 292 597 219Q616 293 635.5 365.5Q655 438 680 510L891 1118H1166L686 -144Q635 -278 544 -352Q453 -426 301 -426Q246 -426 199.5 -418Q153 -410 127 -399Z"/><path transform="translate(3610.3 0)" d="M398 655V0H138V1118H384L387 895Q487 1132 733 1132Q906 1132 1010.5 1022Q1115 912 1115 711V0H855V671Q855 783 797 847Q739 911 637 911Q533 911 465.5 844Q398 777 398 655Z"/><path transform="translate(4765.3 0)" d="M623 -23Q460 -23 340 49.5Q220 122 154.5 251.5Q89 381 89 553Q89 727 154.5 857.5Q220 988 340 1060Q460 1132 623 1132Q810 1132 939.5 1038.5Q1069 945 1105 781L862 730Q841 817 780 869Q719 921 625 921Q489 921 421.5 816Q354 711 354 554Q354 451 384 368Q414 285 474 236.5Q534 188 625 188Q721 188 782.5 242.5Q844 297 865 387L1108 336Q1072 169 942 73Q812 -23 623 -23Z"/></g></svg></div><div class="code" id="code"></div></div>
  <div class="conn" id="conn">Connecting…</div>
</header>
<div id="roombar">
  <div id="signer">Signer not connected</div>
  <div id="people"></div>
  <label class="toggle"><input type="checkbox" id="speakOn" checked> Speak captions aloud</label>
</div>
<div id="captions"><div class="empty" id="empty">Captions will appear here.</div></div>
<div id="controls">
  <button id="mic" type="button">Talk</button>
  <div class="right">
    <form id="textform"><input id="text" placeholder="Type to the room…" autocomplete="off"><button class="send">Send</button></form>
    <div id="micnote"></div>
  </div>
</div>
<div id="namebox" hidden>
  <form class="card" id="nameform">
    <div class="mark">In<span>Sync</span></div>
    <div><b>Join room <span id="code2"></span></b></div>
    <p>The signer's words appear here as captions and voice. What you say is shown to them as captions and signing.</p>
    <input id="name" placeholder="Your name" maxlength="40" autocomplete="name">
    <button class="send">Join</button>
  </form>
</div>
<script>
// Room code from /join/<code>
const code = (location.pathname.split("/").filter(Boolean).pop() || "").toUpperCase();
const $ = id => document.getElementById(id);
$("code").textContent = code; $("code2").textContent = code;
document.title = "InSync · " + code;
let ws = null, name = "", signerName = "";

const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// Name
function start(n) { name = n; $("namebox").hidden = true; connect(); }
const saved = store.get("insync.name");
if (saved) start(saved); else { $("namebox").hidden = false; $("name").focus(); }
$("nameform").onsubmit = e => { e.preventDefault(); const n = $("name").value.trim(); if (!n) return; store.set("insync.name", n); start(n); };

// Speak toggle (default on, remembered)
$("speakOn").checked = store.get("insync.speak") !== "0";
$("speakOn").onchange = () => { store.set("insync.speak", $("speakOn").checked ? "1" : "0"); if (!$("speakOn").checked && window.speechSynthesis) speechSynthesis.cancel(); };

// Connection with a 2 s reconnect loop
function setConn(text, cls) { $("conn").textContent = text; $("conn").className = "conn " + (cls || ""); }
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(code)}&role=participant&name=${encodeURIComponent(name)}`);
  ws.onopen = () => setConn("Connected", "ok");
  ws.onmessage = e => { try { onMessage(JSON.parse(e.data)); } catch (err) { console.warn(err); } };
  ws.onclose = e => {
    setConn(e.code === 4404 ? "Room not found, retrying…" : "Reconnecting…", "bad");
    showPeople([]);
    setTimeout(connect, 2000);
  };
}
function send(m) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ ts: Date.now(), ...m })); return true; } return false; }

// Messages
function onMessage(m) {
  if (m.type === "room") showPeople(m.participants || []);
  else if (m.type === "caption") addCaption(m.speaker, m.text);
  else if (m.type === "speak") speak(m.text);
  else if (m.type === "speech_audio") playSpeechAudio(m);
}

// People: signer first, then participants
function showPeople(list) {
  const s = list.find(p => p.role === "signer");
  if (s) signerName = s.name;
  $("signer").textContent = s ? "Signer is live" : "Signer not connected";
  $("signer").className = s ? "live" : "";
  $("people").innerHTML = "";
  for (const p of list) {
    const c = document.createElement("span");
    const me = p.role !== "signer" && p.name === name;
    c.className = "chip" + (p.role === "signer" ? " signer" : "") + (me ? " me" : "");
    c.textContent = p.name + (p.role === "signer" ? " · signer" : me ? " (you)" : "");
    $("people").appendChild(c);
  }
}

// Captions: newest at the bottom, auto-scroll unless the reader scrolled up
function addCaption(speaker, text) {
  if (!text) return;
  $("empty").hidden = true;
  const box = $("captions"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const d = document.createElement("div");
  d.className = "cap" + (speaker === signerName ? " signer" : speaker === name ? " me" : "");
  d.innerHTML = '<div class="who"></div><div class="txt"></div>';
  d.querySelector(".who").textContent = speaker || "";
  d.querySelector(".txt").textContent = text;
  box.appendChild(d);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// Voice out: the signer's sentences. ElevenLabs audio (speech_audio) when the service sends it
// within 2.5 s, otherwise the browser's own voice; never both for the same sentence.
const pendingSpeak = new Map();   // text -> fallback timer
function speak(text) {
  if (!text || !$("speakOn").checked) return;
  clearTimeout(pendingSpeak.get(text));
  pendingSpeak.set(text, setTimeout(() => {
    pendingSpeak.delete(text);
    if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }, 2500));
}
function playSpeechAudio(m) {
  if (!$("speakOn").checked) return;
  if (!pendingSpeak.has(m.text)) return;   // already spoken by the browser, or speak never arrived
  clearTimeout(pendingSpeak.get(m.text));
  pendingSpeak.delete(m.text);
  const mime = m.format === "mp3" ? "audio/mpeg" : "audio/" + (m.format || "mpeg");
  new Audio("data:" + mime + ";base64," + m.audio).play().catch(() => {
    if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(m.text));
  });
}

// Voice in: browser speech recognition, one utterance per tap
// TODO(phase2): ElevenLabs / cloud STT where webkitSpeechRecognition is missing
function sendText(text) {
  text = text.trim();
  if (text) send({ type: "speech_text", text });   // TODO(phase2): Claude context step happens server-side
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $("mic").disabled = true; $("micnote").textContent = "Mic not supported in this browser, type instead"; }
else {
  let rec = null;
  $("mic").onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.continuous = false; rec.interimResults = false; rec.lang = navigator.language || "en-US";
    rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) sendText(e.results[i][0].transcript); };
    rec.onerror = e => { $("micnote").textContent = "Mic: " + e.error; };
    rec.onend = () => { rec = null; if ($("micnote").textContent === "Listening…") $("micnote").textContent = ""; $("mic").classList.remove("on"); $("mic").textContent = "Talk"; };
    $("micnote").textContent = "Listening…"; $("mic").classList.add("on"); $("mic").textContent = "Stop";
    rec.start();
  };
}
$("textform").onsubmit = e => { e.preventDefault(); sendText($("text").value); $("text").value = ""; };
</script>
</body>
</html>
